
name: Build and Release Kathavani APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-apk]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kathavani-APK
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7

      - name: Create GitHub Release and attach APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="kathavani-v1.0.0-build-${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" "${{ steps.apk.outputs.path }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kathavani APK $TAG" \
            --notes "Debug APK build from commit ${GITHUB_SHA}. This APK is for testing/installing; it is not Play Store-signed."
